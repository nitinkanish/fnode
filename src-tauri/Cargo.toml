[package]
name = "fnode"
version = "0.3.0"
description = "Your machine. Your node. One pulse."
authors = ["Nitin Kanish"]
license = "MIT"
homepage = "https://github.com/nitinkanish/fnode"
repository = "https://github.com/nitinkanish/fnode"
edition = "2021"

[lib]
name = "fnode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = [
    "system",
    "network",
    "disk",
    "component",
    "multithread",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
bollard = { version = "0.18", default-features = false, features = ["chrono", "http", "pipe"] }
tokio = { version = "1", features = ["rt", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
libc = "0.2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
debug = false
incremental = false
