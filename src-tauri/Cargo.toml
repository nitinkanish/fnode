[package]
name = "fnode"
version = "0.2.0"
description = "Your machine. Your node. One pulse."
authors = ["Nitin Kanish"]
license = "MIT"
homepage = "https://github.com/nitinkanish/fnode"
repository = "https://github.com/nitinkanish/fnode"
edition = "2021"

[lib]
name = "fnode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
bollard = "0.18"
tokio = { version = "1", features = ["time", "process", "io-util", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
thiserror = "2"
libc = "0.2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
regex = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
