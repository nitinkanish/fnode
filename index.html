<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FNode</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f2f7;
        color: rgba(0, 0, 0, 0.85);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-app-region: drag;
        user-select: none;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #1c1c1e;
          color: rgba(255, 255, 255, 0.92);
        }
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: splash-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash-mark {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 22px;
      }
      .splash-mark::before {
        content: "";
        position: absolute;
        inset: -18px;
        border-radius: 32px;
        background: radial-gradient(circle, rgba(232, 92, 71, 0.35), transparent 68%);
        animation: splash-glow 2.2s ease-in-out infinite;
      }
      .splash-mark img {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.35) inset,
          0 18px 40px rgba(232, 92, 71, 0.28);
      }
      .splash-name {
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.035em;
        line-height: 1.1;
      }
      .splash-tag {
        margin-top: 8px;
        font-size: 13px;
        letter-spacing: -0.01em;
        color: rgba(60, 60, 67, 0.55);
      }
      @media (prefers-color-scheme: dark) {
        .splash-tag {
          color: rgba(235, 235, 245, 0.5);
        }
      }
      .splash-track {
        margin-top: 28px;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(120, 120, 128, 0.18);
      }
      .splash-fill {
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: #007aff;
        animation: splash-bar 1.15s ease-in-out infinite;
      }
      @media (prefers-color-scheme: dark) {
        .splash-fill {
          background: #0a84ff;
        }
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-glow {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
      @keyframes splash-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-busy="true" aria-label="Loading FNode">
      <div class="splash-inner">
        <div class="splash-mark">
          <img src="/logo.png" width="96" height="96" alt="" />
        </div>
        <div class="splash-name">FNode</div>
        <div class="splash-tag">Your machine. Your node. One pulse.</div>
        <div class="splash-track" aria-hidden="true"><div class="splash-fill"></div></div>
      </div>
    </div>
    <script>
      document.getElementById("splash").dataset.shownAt = String(Date.now());
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
